<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login | LMS</title>

    <link rel="stylesheet" href="css/faculty.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
     <!-- Website Logo (Favicon) -->
    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
</head>

<body>

<div class="background-shape"></div>

<div class="login-container">

    <!-- Left Panel -->

    <div class="left-panel">

        <img src="images/faculty.jpeg" class="admin-image" alt="Faculty">

        <h1>Faculty Portal</h1>

        <p>
            Welcome to the Learning Management System.
            Login to manage courses, attendance,
            assignments, marks and student progress.
        </p>

    </div>

    <div class="divider"></div>

    <!-- Right Panel -->

    <div class="right-panel">

        <div class="login-header">
            <span class="line"></span>
            <h2>Login as Faculty</h2>
        </div>

        <form id="facultyForm">

            <div class="input-box">

                <input
                    type="text"
                    id="facultyUsername"
                    placeholder="Faculty Username"
                    pattern="[A-Za-z0-9@#$%^&*!._-]{3,20}"
                    required>

                <i class="fa-regular fa-user"></i>

            </div>

            <div class="input-box">

                <input
                    type="password"
                    id="facultyPassword"
                    placeholder="Password"
                    required>

                <i class="fa-regular fa-eye"
                   id="toggleFacultyPassword"></i>

            </div>

            <button type="submit">
                LOGIN
            </button>

            <a href="#" class="forgot">
                Forgot Password?
            </a>

            <a href="login.html" class="back">
                ← Back
            </a>

        </form>

        <div class="footer">
            <a href="#">Terms of Use</a>
            <span>|</span>
            <a href="#">Privacy Policy</a>
        </div>

    </div>

</div> 

<script src="js/faculty.js"></script>

</body>
</html>
