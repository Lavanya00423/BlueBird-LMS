<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Report | Bluebird LMS</title>

    <!-- Website Logo (Favicon) -->
    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/attendance-report.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            Bluebird LMS
        </div>

        <ul>

            <li>
                <a href="admin-dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li class="active">
                <a href="reports.html">
                    <i class="fa-solid fa-chart-column"></i>
                    Reports
                </a>
            </li>

            <li>
                <a href="login.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <div class="top-bar">

            <h1>Attendance Report</h1>

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                type="text"
                id="searchAttendance"
                placeholder="Search Student">

            </div>

        </div>

        <!-- Dashboard Cards -->

        <div class="cards">

            <div class="card">

                <i class="fa-solid fa-user-graduate"></i>

                <h2 id="totalStudents">0</h2>

                <p>Total Students</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-calendar-check"></i>

                <h2 id="averageAttendance">0%</h2>

                <p>Average Attendance</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-user-check"></i>

                <h2 id="above75">0</h2>

                <p>Above 75%</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-user-xmark"></i>

                <h2 id="below75">0</h2>

                <p>Below 75%</p>

            </div>

        </div>

        <!-- Attendance Table -->

        <div class="table-container">

            <table id="attendanceTable">

                <thead>

                    <tr>

                        <th>Register No</th>
                        <th>Student Name</th>
                        <th>Department</th>
                        <th>Course</th>
                        <th>Attendance</th>
                        <th>Status</th>

                    </tr>

                </thead>

                <tbody>

                    <!-- Loaded by JavaScript -->

                </tbody>

            </table>

        </div>

        <!-- Buttons -->

        <div class="button-group">

            <button onclick="window.print()" class="print-btn">

                <i class="fa-solid fa-print"></i>

                Print Report

            </button>

            <button onclick="exportCSV()" class="excel-btn">

                <i class="fa-solid fa-file-csv"></i>

                Export CSV

            </button>

        </div>

    </main>

</div>

<script src="js/attendance-report.js"></script>

</body>
</html>
