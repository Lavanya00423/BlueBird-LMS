<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Report | Bluebird LMS</title>

    <!-- Website Logo (Favicon) -->
    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/student-report.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            Bluebird LMS
        </div>

        <ul>

            <li>
                <a href="admin-dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li class="active">
                <a href="reports.html">
                    <i class="fa-solid fa-chart-column"></i>
                    Reports
                </a>
            </li>

            <li>
                <a href="login.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <div class="top-bar">

            <h1>Student Report</h1>

            <div class="search-box">

                <i class="fa-solid fa-search"></i>

                <input
                type="text"
                id="searchStudent"
                placeholder="Search Student">

            </div>

        </div>

        <!-- Cards -->

        <div class="cards">

            <div class="card">

                <i class="fa-solid fa-user-graduate"></i>

                <h2 id="studentCount">0</h2>

                <p>Total Students</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-user-check"></i>

                <h2 id="activeCount">0</h2>

                <p>Active Students</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-user-clock"></i>

                <h2 id="inactiveCount">0</h2>

                <p>Inactive Students</p>

            </div>

        </div>

        <!-- Student Table -->

        <div class="table-container">

            <table id="studentTable">

                <thead>

                    <tr>

                        <th>Register No</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Email</th>
                        <th>Phone</th>

                    </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </div>

        <div class="button-group">

            <button onclick="window.print()" class="print-btn">

                <i class="fa-solid fa-print"></i>

                Print Report

            </button>

            <button onclick="exportCSV()" class="excel-btn">

                <i class="fa-solid fa-file-excel"></i>

                Export CSV

            </button>

        </div>

    </main>

</div>

<script src="js/student-report.js"></script>

</body>
</html>
