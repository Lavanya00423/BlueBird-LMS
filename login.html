<!DOCTYPE html>
<html lang="en">
<head>

<body>

<div class="container">

        <div class="card">
            <img src="images/admin.jpeg" alt="Admin" class="icon">
            <h2>Administrator</h2>
            <a href="admin.html" class="btn">Login</a>
        </div>

        <!-- Faculty -->
        <div class="card">
            <img src="images/faculty.jpeg" alt="Faculty" class="icon">
            <h2>Faculty</h2>
            <a href="faculty.html" class="btn">Login</a>
        </div>

        <!-- Student -->
        <div class="card">
            <img src="images/student.jpeg" alt="Student" class="icon">
            <h2>Student</h2>
            <a href="student.html" class="btn">Login</a>
        </div>

    </div>

</div>
