<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Result Report | Bluebird LMS</title>

    <!-- Website Logo (Favicon) -->
    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/result-report.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            Bluebird LMS
        </div>

        <ul>

            <li>
                <a href="admin-dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li class="active">
                <a href="reports.html">
                    <i class="fa-solid fa-chart-column"></i>
                    Reports
                </a>
            </li>

            <li>
                <a href="login.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <!-- Header -->

        <div class="top-bar">

            <h1>Result Report</h1>

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="searchResult"
                    placeholder="Search Student">

            </div>

        </div>

        <!-- Dashboard Cards -->

        <div class="cards">

            <div class="card">

                <i class="fa-solid fa-user-graduate"></i>

                <h2 id="totalStudents">0</h2>

                <p>Total Students</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-circle-check"></i>

                <h2 id="passStudents">0</h2>

                <p>Passed Students</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-circle-xmark"></i>

                <h2 id="failStudents">0</h2>

                <p>Failed Students</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-chart-line"></i>

                <h2 id="passPercentage">0%</h2>

                <p>Pass Percentage</p>

            </div>

        </div>

        <!-- Result Report Table -->

        <div class="table-container">

            <table id="resultTable">

                <thead>

                    <tr>

                        <th>Register No</th>
                        <th>Student Name</th>
                        <th>Department</th>
                        <th>Course</th>
                        <th>Marks</th>
                        <th>Grade</th>
                        <th>Result</th>

                    </tr>

                </thead>

                <tbody>

                    <!-- Loaded using JavaScript -->

                </tbody>

            </table>

        </div>

        <!-- Buttons -->

        <div class="button-group">

            <button
                class="print-btn"
                onclick="window.print()">

                <i class="fa-solid fa-print"></i>

                Print Report

            </button>

            <button
                class="excel-btn"
                onclick="exportCSV()">

                <i class="fa-solid fa-file-csv"></i>

                Export CSV

            </button>

        </div>

    </main>

</div>

<script src="js/result-report.js"></script>

</body>
</html>
